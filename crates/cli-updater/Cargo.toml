[package]
name = "cli-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.89"
cli-release-interface.workspace = true
flate2 = "1.1.9"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
semver = "1.0.28"
serde = "1.0.228"
serde_json = "1.0.149"
sha2 = "0.11.0"
tar = "0.4.45"
tempfile = "3.27.0"
thiserror = "2.0.18"
unimock = "0.6.8"

[dev-dependencies]
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
